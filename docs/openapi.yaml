  responses:
    AccountResponse:
      description: Account including current nullable fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
    LegacyAsset:
      description: Vendor demoAsset JSON from outDemoJson(), including arrays of balances,
        positions and transactions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Vendor_demoAsset'
    BadRequest:
      description: Invalid request parameters/body or financial transaction rejected
        by the vendor engine
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or incorrect HTTP Basic credentials
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Basic realm="regulus"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated caller lacks API role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Account or account book not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate account, database constraint violation, or financial
        processDate earlier than the latest book
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Request must use Content-Type application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected database or engine error; internal details are not exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
