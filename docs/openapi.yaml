openapi: 3.0.3
info:
  title: Regulus API
  version: 1.0.0
  description: Account and financial API using Spring Boot 2.7.18 on Java 8. All operations
    require HTTP Basic authentication; use HTTPS outside local development. Financial
    field schemas were recovered from the exact vendor library embedded in the supplied
    deployed app.jar. Business code meanings and production SQL Server behavior require
    owner acceptance testing. Financial persistence uses parameterized Spring JDBC
    transactions; no automatic retry or idempotency guarantee is provided.
servers:
- url: http://localhost:8080
  description: Local executable JAR / Docker
- url: https://your-server
  description: Windows executable JAR behind TLS; replace host
security:
- basicAuth: []
tags:
- name: Accounts
- name: Finance
paths:
  /api/database:
    get:
      operationId: getDatabaseName
      tags:
      - Accounts
      summary: Get the connected database name
      responses:
        '200':
          description: SQL Server database name; regulus-local for H2
          content:
            text/plain:
              schema:
                type: string
                example: regulus-local
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Requested response media type unavailable
  /api/accounts:
    get:
      operationId: listAccounts
      tags:
      - Accounts
      summary: List all accounts or accounts for a firm
      parameters:
      - name: firmId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Sorted by accountId, or firmId then accountId if unfiltered;
            empty list when none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Requested response media type unavailable
  /api/account/edit:
    post:
      operationId: createAccount
      tags:
      - Accounts
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Account'
              - type: object
                required:
                - firmId
                - accountId
            example:
              firmId: 1
              accountId: ABC123
              accountName: Example Account
              marginable: false
      responses:
        '201':
          $ref: '#/components/responses/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Requested response media type unavailable
    patch:
      operationId: updateAccount
      tags:
      - Accounts
      summary: Update non-null fields of an existing account
      description: 'Omitted and null fields are unchanged; false booleans are applied.

        firmId and accountId in the body are ignored; identity comes from query parameters.

        An empty object is a successful no-op for an existing account.

        '
      parameters:
      - $ref: '#/components/parameters/FirmId'
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
            example:
              accountName: Updated Account
              marginable: false
      responses:
        '200':
          $ref: '#/components/responses/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Requested response media type unavailable
    delete:
      operationId: deleteAccount
      tags:
      - Accounts
      summary: Delete an account master record
      description: Does not explicitly delete account books; database constraints
        may reject deletion.
      parameters:
      - $ref: '#/components/parameters/FirmId'
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - firmId
                - accountId
                properties:
                  message:
                    type: string
                    example: Account deleted successfully
                  firmId:
                    type: integer
                    format: int32
                  accountId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Requested response media type unavailable
  /api/cash:
    post:
      operationId: processCash
      tags:
      - Finance
      summary: Process cash using the deployed vendor engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendor_cash'
            example:
              account:
                firmId: 1
                accountId: ABC123
                correspondent: ''
                branch: ''
                rep: ''
              accountType: 1
              processDate: '2026-10-08'
              tradeDate: '2026-10-08'
              settleDate: '2026-10-08'
              asofDate: '2026-10-08'
              currency: USD
              amount: 100.0
              amountCurr: 100.0
              entryCode: DEPO
              subSource: DEPOSIT
              desc1: test
              controlId: CASH001
      responses:
        '200':
          $ref: '#/components/responses/LegacyAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
        '406':
          description: Requested response media type unavailable
      description: Loads the latest book, applies forward process-date rollover, processes
        the transaction and persists vendor book JSON atomically. An earlier processDate
        returns 409. A new book is initialized at the supplied date. Financial POSTs
        are not guaranteed idempotent; do not retry blindly.
  /api/trade:
    post:
      operationId: processTrade
      tags:
      - Finance
      summary: Process trade using the deployed vendor engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendor_trade'
            example:
              account:
                firmId: 1
                accountId: ABC123
                correspondent: ''
                branch: ''
                rep: ''
              accountType: 1
              processDate: '2026-10-08'
              tradeDate: '2026-10-08'
              settleDate: '2026-10-09'
              currency: USD
              secType: EQUITY
              secId: NVDA
              qty: 2.0
              qtyCurr: 2.0
              qtyOrig: 2.0
              price: 10.0
              amount: 20.0
              amountCurr: 20.0
              amountOrig: 20.0
              controlId: TRADE001
      responses:
        '200':
          $ref: '#/components/responses/LegacyAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
        '406':
          description: Requested response media type unavailable
      description: Loads the latest book, applies forward process-date rollover, processes
        the transaction and persists vendor book JSON atomically. An earlier processDate
        returns 409. A new book is initialized at the supplied date. Financial POSTs
        are not guaranteed idempotent; do not retry blindly.
  /api/stock:
    post:
      operationId: processStock
      tags:
      - Finance
      summary: Process stock using the deployed vendor engine
      requestBody:
        required: true
