              amountCurr: 20.0
              amountOrig: 20.0
              controlId: STOCK001
              location: '99'
      responses:
        '200':
          $ref: '#/components/responses/LegacyAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          $ref: '#/components/responses/Conflict'
        '406':
          description: Requested response media type unavailable
      description: Loads the latest book, applies forward process-date rollover, processes
        the transaction and persists vendor book JSON atomically. An earlier processDate
        returns 409. A new book is initialized at the supplied date. Financial POSTs
        are not guaranteed idempotent; do not retry blindly.
  /api/asset:
    get:
      operationId: getLegacyAsset
      tags:
      - Finance
      summary: Load the latest or dated vendor account book
      parameters:
      - $ref: '#/components/parameters/FirmId'
      - $ref: '#/components/parameters/AccountId'
      - name: processDate
        in: query
        required: false
        description: ISO calendar date; omitted means latest
        schema:
          type: string
          format: date
          example: '2026-10-08'
      responses:
        '200':
          $ref: '#/components/responses/LegacyAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          description: Requested response media type unavailable
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Authorization header is Basic base64(username:password). No token
        endpoint or cookies.

        Local profile uses developer / local-only-password. Other profiles use API_USERNAME

        and API_PASSWORD. All authenticated application users have the API role.

        Clients must not rely on browser session authentication. Use HTTPS on the
        server.

        '
  parameters:
    FirmId:
      name: firmId
      in: query
      required: true
      schema:
        type: integer
        format: int32
    AccountId:
      name: accountId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: \S
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AccountPatch:
      type: object
      properties:
        correspondent:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        rep:
          type: string
          nullable: true
        accountName:
          type: string
          nullable: true
        accountCat:
          type: string
          nullable: true
        marginable:
          type: boolean
          nullable: true
        aggregate:
          type: boolean
          nullable: true
        taxlotMethod:
          type: string
          nullable: true
    Account:
      allOf:
      - $ref: '#/components/schemas/AccountPatch'
      - type: object
        properties:
          firmId:
            type: integer
            format: int32
          accountId:
            type: string
            minLength: 1
            pattern: \S
    AccountSummary:
      type: object
      properties:
        accountId:
          type: string
        accountName:
          type: string
          nullable: true
    Vendor_cash:
      type: object
      properties:
        subSource:
          type: string
          nullable: true
        recType:
          type: string
          nullable: true
        effectiveDays:
          type: integer
          format: int32
        desc1:
          type: string
          nullable: true
        desc2:
          type: string
          nullable: true
        desc3:
          type: string
          nullable: true
        account:
