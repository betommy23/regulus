          format: int32
          nullable: true
        offsetAccount:
          type: string
          nullable: true
        offsetCorr:
          type: string
          nullable: true
        offsetAccountType:
          type: integer
          format: int32
          nullable: true
        secType:
          type: string
          nullable: true
        secId:
          type: string
          nullable: true
        secIdType:
          type: string
          nullable: true
        secDescription:
          type: string
          nullable: true
        tradeDate:
          type: string
          format: date
          nullable: true
        settleDate:
          type: string
          format: date
          nullable: true
        asofDate:
          type: string
          format: date
          nullable: true
        convFactor:
          type: number
          format: double
          nullable: true
        qty:
          type: number
          format: double
          nullable: true
        amount:
          type: number
          format: double
          nullable: true
        price:
          type: number
          format: double
          nullable: true
        qtyOrig:
          type: number
          format: double
          nullable: true
        amountOrig:
          type: number
          format: double
          nullable: true
        qtyCurr:
          type: number
          format: double
          nullable: true
        amountCurr:
          type: number
          format: double
          nullable: true
        entryCode:
          type: string
          nullable: true
        controlId:
          type: string
          nullable: true
        openClose:
          type: string
          nullable: true
        sideCode:
          type: string
          nullable: true
        stateCode:
          type: string
          nullable: true
        open_systemId:
          type: integer
          format: int64
          nullable: true
        who:
