# Disposable local development database; never activate this profile on the server.
spring:
  datasource:
    url: jdbc:h2:mem:regulus;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local-schema.sql
app:
  security:
    username: developer
    password: local-only-password
